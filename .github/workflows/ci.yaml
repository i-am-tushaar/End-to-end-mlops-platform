name: CI Pipeline

on: push

jobs:
  setup-and-train:
    runs-on: ubuntu-latest

    env:
      CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}

    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-python-env

      - name: Run pipeline
        run: dvc repro

  model-tests:
    runs-on: ubuntu-latest
    needs: setup-and-train

    env:
      CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}

    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-python-env

      - name: Run model tests
        run: python -m unittest tests/test_model.py

  promote-model:
    runs-on: ubuntu-latest
    needs: model-tests

    env:
      CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}

    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-python-env

      - name: Promote model to production
        run: python scripts/promote_model.py

  flask-tests:
    runs-on: ubuntu-latest
    needs: promote-model

    env:
      CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}

    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-python-env

      - name: Run Flask app tests
        run: python -m unittest tests/test_flask_app.py

  docker-build-push:
    runs-on: ubuntu-latest
    needs: flask-tests

    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-python-env

      # AWS setup
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ secrets.ECR_REPOSITORY }} \
            --region ${{ secrets.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ secrets.ECR_REPOSITORY }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest